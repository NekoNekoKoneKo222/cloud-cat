<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="匿名で話せる、やわらかなチャットとボイスルーム" />
  <title>cloud cat — 匿名チャット</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23f5b44b' d='M12 25 9 9l15 8c5-2 11-2 16 0l15-8-3 16c7 14-1 30-20 30S5 39 12 25Z'/%3E%3Ccircle cx='23' cy='32' r='3' fill='%23362a3d'/%3E%3Ccircle cx='41' cy='32' r='3' fill='%23362a3d'/%3E%3Cpath d='M28 40q4 4 8 0M32 37v3' fill='none' stroke='%23362a3d' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
    :root{--ink:oklch(.32 .04 55);--muted:oklch(.55 .035 60);--paper:oklch(.975 .018 82);--cream:oklch(.96 .025 80);--peach:oklch(.9 .06 25);--orange:oklch(.72 .14 52);--coral:oklch(.6 .19 25);--violet:oklch(.45 .07 20);--line:oklch(.9 .025 75);--mint:oklch(.68 .1 155);--card:oklch(.995 .01 85);--shadow:0 14px 36px oklch(.45 .07 60 / .18)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 12% 8%,oklch(.93 .05 60 / .55) 0,transparent 28rem),radial-gradient(circle at 87% 94%,oklch(.92 .05 25 / .45) 0,transparent 25rem),var(--paper);font:15px/1.55 'Zen Maru Gothic',sans-serif;color:var(--ink);min-height:100vh} button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1440px;margin:auto;padding:24px;min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr) 292px;gap:18px}.panel{background:color-mix(in oklch,var(--card) 84%,transparent);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    .cat{filter:drop-shadow(0 3px 0 oklch(.62 .12 52))!important}.brand b{font-family:'Kiwi Maru',sans-serif!important}.room:hover,.person:hover{background:var(--cream)!important}.room.active{background:var(--card)!important;box-shadow:0 3px 12px oklch(.55 .08 55 / .15)!important}.room-icon{background:var(--peach)!important}.circle-btn{background:var(--cream)!important}.notice{background:var(--cream)!important;border-color:var(--line)!important;color:var(--muted)!important}.bubble,.composer input{background:var(--card)!important;border-color:var(--line)!important}.mine .bubble{background:var(--peach)!important;border-color:oklch(.8 .09 42)!important}.composer{background:linear-gradient(transparent,var(--paper) 35%)!important}.composer input:focus{box-shadow:0 0 0 3px oklch(.88 .07 52 / .5)!important}.send{color:var(--card)!important;box-shadow:0 5px 12px oklch(.6 .19 25 / .26)!important}.voice-card{background:linear-gradient(145deg,oklch(.42 .06 25),oklch(.30 .04 55))!important}.voice-live{font-family:'Zen Maru Gothic',sans-serif!important;color:oklch(.9 .12 82)!important}.voice-users .avatar{border-color:oklch(.42 .06 25)!important}.join{background:var(--orange)!important;color:var(--card)!important}.voice-card.in .join{background:var(--coral)!important}.status{box-shadow:0 0 0 3px oklch(.9 .04 155)!important}.history-note{background:var(--cream)!important}
    .side{padding:22px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.cat{font-size:31px;line-height:1;filter:drop-shadow(0 3px 0 #e89b42)}.brand b{font:700 21px 'DM Mono',monospace;letter-spacing:-1.5px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em}.identity{background:var(--cream);padding:12px;border-radius:15px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#bb9be1;display:grid;place-items:center;color:#fff;font-weight:bold}.identity strong{font-size:13px;display:block}.identity span{font-size:11px;color:var(--muted)}.rooms-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.08em}.plus{background:var(--orange);color:white;width:25px;height:25px;border-radius:9px;font-size:20px;line-height:1}.room-list{display:grid;gap:5px}.room{padding:11px 12px;border-radius:13px;display:flex;align-items:center;gap:9px;color:var(--muted);background:transparent;text-align:left;width:100%}.room:hover{background:#fff4e6}.room.active{color:var(--ink);background:#fff;box-shadow:0 3px 12px #d9b9903b;font-weight:700}.room i{font-style:normal;font-size:17px}.room .count{margin-left:auto;font:11px 'DM Mono';color:#a99fa3}.side-foot{margin-top:auto;border-top:1px dashed var(--line);padding:16px 8px 0;color:var(--muted);font-size:12px}.side-foot button{margin-top:7px;padding:0;background:none;color:var(--coral);font-size:12px}
    .chat{min-height:calc(100vh - 48px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.chat-top{padding:18px 23px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.room-icon{background:#fee1b9;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:21px}.room-title{font-weight:700;font-size:16px}.room-meta{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px;margin-left:auto}.circle-btn{width:37px;height:37px;border-radius:12px;background:var(--cream);color:var(--violet);font-size:17px}.messages{padding:22px 24px 8px;overflow-y:auto;max-height:calc(100vh - 205px);display:flex;flex-direction:column;gap:18px}.notice{align-self:center;color:#8a7d73;font-size:11px;background:#fff5e7;border:1px solid #f3dfc7;border-radius:20px;padding:5px 12px}.msg{display:grid;grid-template-columns:35px 1fr;gap:10px;max-width:82%}.msg .avatar{width:35px;height:35px;font-size:12px}.msg-header{font-size:12px;font-weight:700}.msg-header time{color:#9b9296;font-weight:400;margin-left:7px;font-size:11px}.bubble{display:inline-block;margin-top:4px;padding:10px 13px;background:#fff;border:1px solid #f0e6d9;border-radius:4px 15px 15px 15px;box-shadow:0 3px 10px rgba(83,59,39,.04);font-size:14px}.video-bubble{display:block;width:min(100%,420px);padding:6px;overflow:hidden}.video-bubble iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px}.mine{align-self:flex-end;grid-template-columns:1fr 35px}.mine .avatar{grid-column:2}.mine .msg-body{grid-column:1;grid-row:1;text-align:right}.mine .bubble{background:#f8d6aa;border-color:#f5c88b;border-radius:15px 4px 15px 15px;text-align:left}.typing{margin:0 24px;color:var(--muted);font-size:12px;min-height:22px}.typing b{color:var(--violet)}.composer{padding:12px 18px 17px;display:flex;gap:9px;background:linear-gradient(transparent,#fffaf1 35%)}.composer input{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 15px;outline:none}.composer input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #fce1bf}.send{background:var(--coral);color:#fff;width:46px;border-radius:14px;font-size:19px;box-shadow:0 5px 12px #df70594a}
    .lucide{width:1.15em;height:1.15em;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}.cat .lucide{width:34px;height:34px}.room i .lucide{width:18px;height:18px}.room-icon .lucide{width:22px;height:22px}.icon-btn .lucide{width:18px;height:18px}.right{padding:18px;display:flex;flex-direction:column;gap:16px}.right h2{font-size:13px;margin:0;letter-spacing:.05em}.voice-card{background:linear-gradient(145deg,#655783,#4c426c);padding:18px;border-radius:18px;color:white;position:relative;overflow:hidden}.voice-card p{font-size:12px;opacity:.77;margin:3px 0 13px}.voice-live{font:11px 'DM Mono';color:#f7d895;letter-spacing:.1em}.voice-users{display:flex;margin:10px 0 15px}.voice-users .avatar{border:2px solid #665783;margin-right:-7px;width:32px;height:32px;font-size:10px}.join{background:#f6bd57;color:#3f3455;font-weight:700;width:100%;border-radius:11px;padding:10px}.voice-card.in .join{background:#ef9580;color:#fff}.online-list{display:grid;gap:4px}.person{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px}.person:hover{background:var(--cream)}.status{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px #d9f0e5}.person .avatar{width:30px;height:30px;font-size:11px}.person strong{font-size:12px;display:block}.person small{font-size:11px;color:var(--muted)}.mic{margin-left:auto;color:var(--violet);font-size:13px}.history-note{margin-top:auto;background:#f4efe9;border-radius:14px;padding:12px;font-size:11px;color:var(--muted)}.history-note .lucide{margin-right:4px}
    @media(max-width:900px){.app{grid-template-columns:210px 1fr;padding:14px}.right{display:none}.chat{min-height:calc(100vh - 28px)}}@media(max-width:620px){.app{display:block;padding:8px}.side{display:none}.chat{min-height:calc(100vh - 16px);border-radius:17px}.messages{padding:16px;max-height:calc(100vh - 186px)}.msg{max-width:95%}.chat-top{padding:13px}.top-actions button:first-child{display:none}}
  </style>
</head>
<body>
<main class="app">
  <aside class="panel side"><div class="brand"><div class="cat" data-icon="cat"></div><div><b>cloud cat</b><small>anonymous rooms</small></div></div><div class="identity"><div class="avatar">あ</div><div><strong id="myName">あまい雲</strong><span>匿名で参加中</span></div></div><section><div class="rooms-head">ROOMS <button class="plus" aria-label="ルームを作成" onclick="createRoom()">＋</button></div><div class="room-list" id="rooms"><button class="room active" onclick="selectRoom(this,'ねこだまり','paw')"><i data-icon="paw"></i>ねこだまり <span class="count">18</span></button><button class="room" onclick="selectRoom(this,'深夜のまど','moon')"><i data-icon="moon"></i>深夜のまど <span class="count">6</span></button><button class="room" onclick="selectRoom(this,'お茶と音楽','star')"><i data-icon="star"></i>お茶と音楽 <span class="count">11</span></button><button class="room" onclick="selectRoom(this,'作業する猫','pencil')"><i data-icon="pencil"></i>作業する猫 <span class="count">24</span></button></div></section><div class="side-foot">合言葉はありません。気になる部屋に、ふらりとどうぞ。<br><button onclick="renameMe()">表示名を変える</button></div></aside>
  <section class="panel chat"><header class="chat-top"><div class="room-icon" id="roomIcon" data-icon="paw"></div><div><div class="room-title" id="roomTitle">ねこだまり</div><div class="room-meta">だれでも参加できます · <span id="memberCount">18</span>人がいる</div></div><div class="top-actions"><button class="circle-btn icon-btn" title="最近の10件を表示" onclick="showRecent()" data-icon="alert"></button><button class="circle-btn icon-btn" title="ルーム情報" data-icon="star"></button></div></header><div class="messages" id="messages"><div class="notice">最近のメッセージ（10件）</div></div><div class="typing" id="typing"></div><form class="composer" onsubmit="sendMessage(event)"><input id="messageInput" autocomplete="off" placeholder="匿名でメッセージを送る…" aria-label="メッセージ" /><button class="send icon-btn" aria-label="送信" data-icon="send"></button></form></section>
  <aside class="panel right"><div><h2>VOICE CHAT</h2><div class="voice-card" id="voiceCard"><div class="voice-live">LIVE · 3人が話しています</div><h3 style="margin:7px 0 0">おひるねラウンジ</h3><p>参加しなくても、ここにいる人が見えます。</p><div class="voice-users"><div class="avatar" style="background:#e5907e">A</div><div class="avatar" style="background:#80acbd">B</div><div class="avatar" style="background:#b598d2">C</div></div><button class="join" id="joinBtn" onclick="toggleVoice()"></button></div></div><div><h2>このルームにいる猫</h2><div class="online-list"><div class="person"><span class="status"></span><div class="avatar" style="background:#e5907e">A</div><div><strong>参加者 A</strong><small>ボイスチャット中</small></div><span class="mic"></span></div><div class="person"><span class="status"></span><div class="avatar" style="background:#80acbd">B</div><div><strong>参加者 B</strong><small>ボイスチャット中</small></div><span class="mic"></span></div><div class="person"><span class="status"></span><div class="avatar" style="background:#b598d2">C</div><div><strong>参加者 C</strong><small>ボイスチャット中</small></div><span class="mic"></span></div><div class="person"><span class="status"></span><div class="avatar" style="background:#e1aa60">D</div><div><strong>参加者 D</strong><small>テキストチャット中</small></div></div></div><div class="history-note"><span></span>会話の履歴は端末に保存されます。退出しても消えません。</div></aside>
</main>
<script>
const iconPaths={cat:'M12 5 9 2 5 6v7a7 7 0 0 0 14 0V6l-4-4-3 3M9 13h.01M15 13h.01M9 17c1.5 1 4.5 1 6 0',paw:'M11.6 16.6c1.2-1.4 2.4-2.9 3.2-4.5.7-1.4.7-2.8-.3-3.6-1.1-.9-2.4-.1-3 1.1-.6-1.2-1.9-2-3-1.1-1 .8-1 2.2-.3 3.6.8 1.6 2 3.1 3.2 4.5ZM7 7.5A1.5 1.5 0 1 0 7 4.5a1.5 1.5 0 0 0 0 3Zm10 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z',fish:'M12 8c-3 0-5.5 1.7-7 4 1.5 2.3 4 4 7 4 3.8 0 6.6-2.6 8-4-1.4-1.4-4.2-4-8-4Zm2 4h.01M4 8l-2-2m2 10-2 2',heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8Z',star:'m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.3-6.2 3.3 1.2-6.8-5-4.9 6.9-1L12 2Z',moon:'M20.6 12.7A8.5 8.5 0 1 1 11.3 3a6.7 6.7 0 0 0 9.3 9.7Z',sparkle:'m12 3-1.5 5.5L5 10l5.5 1.5L12 17l1.5-5.5L19 10l-5.5-1.5L12 3Zm7 12-.7 2.3L16 18l2.3.7L19 21l.7-2.3L22 18l-2.3-.7L19 15Z',sun:'M12 4V2m0 20v-2m5.7-13.7 1.4-1.4m-14.2 14.2 1.4-1.4M20 12h2M2 12h2m13.7 5.7 1.4 1.4M4.9 4.9l1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z',pencil:'m14 4 6 6M4 20l4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z',send:'m22 2-7 20-4-9-9-4 20-7ZM11 13l4-4',alert:'M12 9v4m0 4h.01M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z',mic:'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Zm6 9a6 6 0 0 1-12 0m6 6v4m-4 0h8'};
function icon(name){return `<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="${iconPaths[name]||iconPaths.star}"/></svg>`}function paintIcons(){document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon))}
const sampleMessages=new Set(['みんな、今日もおつかれさま。','窓をあけたら、ちょうどいい風だったよ。','それ、いいなあ。こっちは雨のにおい。','今夜はゆっくり話したい気分です。','ボイスにもいるよ。聞くだけでも歓迎！']);
let activeRoom='ねこだまり';let messages=(JSON.parse(localStorage.getItem('cloudcat-messages')||'[]')||[]).filter(m=>!sampleMessages.has(m[3]));localStorage.setItem('cloudcat-messages',JSON.stringify(messages));let typingTimer;
function youtubeId(value){try{const url=new URL(value.trim());if(url.hostname==='youtu.be')return url.pathname.slice(1).match(/^[\w-]{11}$/)?.[0]||null;if(['youtube.com','www.youtube.com','m.youtube.com'].includes(url.hostname))return (url.searchParams.get('v')||url.pathname.match(/^\/(?:embed|shorts)\/([\w-]{11})/)?.[1]||'').match(/^[\w-]{11}$/)?.[0]||null}catch{return null}}
function messageContent(value){const id=youtubeId(value);return id?`<div class="bubble video-bubble"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="YouTube video player" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`:`<div class="bubble">${escapeHtml(value)}</div>`}
function render(){const root=document.getElementById('messages');root.innerHTML='<div class="notice">最近のメッセージ（10件）</div>';messages.slice(-10).forEach((m,i)=>{let mine=m[0]===document.getElementById('myName').textContent;root.insertAdjacentHTML('beforeend',`<article class="msg ${mine?'mine':''}"><div class="avatar" style="background:#${m[2]}">${m[1]}</div><div class="msg-body"><div class="msg-header">${m[0]}<time>${i+1<10?'今日':'たった今'}</time></div>${messageContent(m[3])}</div></article>`)});root.scrollTop=root.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function sendMessage(e){e.preventDefault();const input=document.getElementById('messageInput');if(!input.value.trim())return;const n=document.getElementById('myName').textContent;messages.push([n,n[0],'bb9be1',input.value.trim()]);localStorage.setItem('cloudcat-messages',JSON.stringify(messages));input.value='';render();setTimeout(()=>{document.getElementById('typing').innerHTML='<b>参加者</b> が入力中…';setTimeout(()=>document.getElementById('typing').textContent='',1800)},450)}
function toggleVoice(){let card=document.getElementById('voiceCard'),btn=document.getElementById('joinBtn'),on=card.classList.toggle('in');btn.innerHTML=on?icon('mic')+' ボイスから退出':icon('mic')+' ボイスに参加';document.querySelector('.voice-live').textContent=on?'接続中 · 4人が話しています':'LIVE · 3人が話しています'}
function selectRoom(el,name,iconName){document.querySelectorAll('.room').forEach(x=>x.classList.remove('active'));el.classList.add('active');activeRoom=name;document.getElementById('roomTitle').textContent=name;document.getElementById('roomIcon').innerHTML=icon(iconName);document.getElementById('typing').textContent='';render()}
function createRoom(){let name=prompt('新しいルームの名前');if(name){let btn=document.createElement('button');btn.className='room';btn.innerHTML='<i>'+icon('sparkle')+'</i>'+escapeHtml(name)+' <span class="count">1</span>';btn.onclick=()=>selectRoom(btn,name,'sparkle');document.getElementById('rooms').append(btn);btn.click()}}
function renameMe(){let n=prompt('新しい匿名表示名',document.getElementById('myName').textContent);if(n){document.getElementById('myName').textContent=n;localStorage.setItem('cloudcat-name',n)}}
function showRecent(){document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}
document.getElementById('myName').textContent=localStorage.getItem('cloudcat-name')||'あまい雲';document.getElementById('messageInput').addEventListener('input',()=>{clearTimeout(typingTimer);typingTimer=setTimeout(()=>{document.getElementById('typing').innerHTML='<b>参加者</b> が入力中…'},600)});paintIcons();document.getElementById('joinBtn').innerHTML=icon('mic')+' ボイスに参加';document.querySelectorAll('.mic').forEach(el=>el.innerHTML=icon('mic'));document.querySelector('.history-note span').replaceWith(Object.assign(document.createElement('span'),{innerHTML:icon('heart')}));render();
</script></body></html>
