<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Cat</title><link rel="stylesheet" href="style.css"><body>
<div id="auth" class="center"><div class="card auth"><div class="logo">☁️🐱</div><h1>Cloud Cat</h1><p>友だちとつながろう</p><div><button id="loginTab">ログイン</button><button id="signupTab">新規登録</button></div><form id="authForm"><input id="username" placeholder="ユーザー名" required><input id="displayName" placeholder="表示名"><input id="password" type="password" placeholder="パスワード（8文字以上）" required><button>開始</button></form><div id="err"></div></div></div>
<div id="app" class="hidden"><aside><h2>☁️ Cloud Cat</h2><button data-p="dm">💬 DM</button><button data-p="friends">👥 フレンド</button><button data-p="groups">👨‍👩‍👧 グループ</button><button data-p="communities">🌎 コミュニティ</button><button data-p="notifications">🔔 通知</button><div id="me"></div><button id="logout">ログアウト</button></aside><main><header><h2 id="title">DM</h2></header><section id="dm"><div class="cols"><div id="rooms" class="list"></div><div class="chat"><div id="msgs" class="msgs"></div><form id="send"><input id="text" placeholder="メッセージ"><input id="img" type="file" accept="image/*" hidden><label for="img">🖼️</label><button>送信</button></form></div></div></section><section id="friends" class="hidden"><div class="bar"><input id="search" placeholder="ユーザー検索"><button id="searchBtn">検索</button></div><div id="results"></div><h3>フレンド</h3><div id="friendList"></div></section><section id="groups" class="hidden"><form id="groupForm"><input id="groupName" placeholder="グループ名"><button>作成</button></form><div id="groupList"></div></section><section id="communities" class="hidden"><form id="comForm"><input id="comName" placeholder="コミュニティ名"><input id="comDesc" placeholder="説明"><button>作成</button></form><div id="comList"></div></section><section id="notifications" class="hidden"><button id="read">すべて既読</button><div id="notiList"></div></section></main></div><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
