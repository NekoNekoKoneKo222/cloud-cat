<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Cat</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><span class="mark">C</span><span>Cloud Cat</span></div><nav id="nav" hidden><button data-page="friends">フレンド</button><button data-page="dm">DM</button><button data-page="rooms">ルーム</button><button data-page="notifications">通知</button><button data-page="profile">プロフィール</button><button data-page="admin" id="admin-tab" hidden>Admin</button><button id="logout">ログアウト</button></nav></header>
<main><p id="status" role="status" aria-live="polite"></p><section id="auth-view" class="panel auth-grid"><form id="login-form"><h1>ログイン</h1><label>ユーザー名<input name="username" required autocomplete="username"></label><label>パスワード<input name="password" type="password" required autocomplete="current-password"></label><button>ログイン</button></form><form id="signup-form"><h2>新規登録</h2><label>ユーザー名<input name="username" required pattern="[a-zA-Z0-9_]{3,32}"></label><label>表示名<input name="displayName" required maxlength="64"></label><label>パスワード<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label class="check"><input name="acceptTerms" type="checkbox" required> <a href="#terms">利用規約</a>に同意する</label><button>登録</button></form></section><section id="app-view" hidden><h1 id="page-title"></h1><div id="page"></div></section><section id="terms" class="panel"><h2>利用規約</h2><p>他の利用者を尊重し、違法な内容や権利を侵害する投稿をしないでください。投稿内容はサービス運営と安全確保のため保存されます。管理者は違反に対して利用制限を行う場合があります。</p></section></main>
<script src="/socket.io/socket.io.js" defer></script><script src="/app.js" defer></script></body></html>
