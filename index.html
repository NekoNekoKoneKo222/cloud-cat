<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="匿名で話せる、やわらかなチャットとボイスルーム" />
  <title>cloud cat — 匿名チャット</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23f5b44b' d='M12 25 9 9l15 8c5-2 11-2 16 0l15-8-3 16c7 14-1 30-20 30S5 39 12 25Z'/%3E%3Ccircle cx='23' cy='32' r='3' fill='%23362a3d'/%3E%3Ccircle cx='41' cy='32' r='3' fill='%23362a3d'/%3E%3Cpath d='M28 40q4 4 8 0M32 37v3' fill='none' stroke='%23362a3d' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
    :root{--ink:#30283a;--muted:#746d79;--paper:#fff9f0;--cream:#fff3df;--peach:#ffd9ae;--orange:#ef9d45;--coral:#df7059;--violet:#66588a;--line:#eadbc8;--mint:#58b88d;--shadow:0 14px 36px rgba(91,64,42,.11)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 12% 8%,#ffe3bd 0,transparent 28rem),radial-gradient(circle at 87% 94%,#d9e6d2 0,transparent 25rem),var(--paper);font:15px/1.55 'Noto Sans JP',sans-serif;color:var(--ink);min-height:100vh} button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1440px;margin:auto;padding:24px;min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr) 292px;gap:18px}.panel{background:rgba(255,253,248,.8);border:1px solid rgba(234,219,200,.95);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
    .side{padding:22px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.cat{font-size:31px;line-height:1;filter:drop-shadow(0 3px 0 #e89b42)}.brand b{font:700 21px 'DM Mono',monospace;letter-spacing:-1.5px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em}.identity{background:var(--cream);padding:12px;border-radius:15px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#bb9be1;display:grid;place-items:center;color:#fff;font-weight:bold}.identity strong{font-size:13px;display:block}.identity span{font-size:11px;color:var(--muted)}.rooms-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px;color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.08em}.plus{background:var(--orange);color:white;width:25px;height:25px;border-radius:9px;font-size:20px;line-height:1}.room-list{display:grid;gap:5px}.room{padding:11px 12px;border-radius:13px;display:flex;align-items:center;gap:9px;color:var(--muted);background:transparent;text-align:left;width:100%}.room:hover{background:#fff4e6}.room.active{color:var(--ink);background:#fff;box-shadow:0 3px 12px #d9b9903b;font-weight:700}.room i{font-style:normal;font-size:17px}.room .count{margin-left:auto;font:11px 'DM Mono';color:#a99fa3}.side-foot{margin-top:auto;border-top:1px dashed var(--line);padding:16px 8px 0;color:var(--muted);font-size:12px}.side-foot button{margin-top:7px;padding:0;background:none;color:var(--coral);font-size:12px}
    .chat{min-height:calc(100vh - 48px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.chat-top{padding:18px 23px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.room-icon{background:#fee1b9;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:21px}.room-title{font-weight:700;font-size:16px}.room-meta{font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:8px;margin-left:auto}.circle-btn{width:37px;height:37px;border-radius:12px;background:var(--cream);color:var(--violet);font-size:17px}.messages{padding:22px 24px 8px;overflow-y:auto;max-height:calc(100vh - 205px);display:flex;flex-direction:column;gap:18px}.notice{align-self:center;color:#8a7d73;font-size:11px;background:#fff5e7;border:1px solid #f3dfc7;border-radius:20px;padding:5px 12px}.msg{display:grid;grid-template-columns:35px 1fr;gap:10px;max-width:82%}.msg .avatar{width:35px;height:35px;font-size:12px}.msg-header{font-size:12px;font-weight:700}.msg-header time{color:#9b9296;font-weight:400;margin-left:7px;font-size:11px}.bubble{display:inline-block;margin-top:4px;padding:10px 13px;background:#fff;border:1px solid #f0e6d9;border-radius:4px 15px 15px 15px;box-shadow:0 3px 10px rgba(83,59,39,.04);font-size:14px}.mine{align-self:flex-end;grid-template-columns:1fr 35px}.mine .avatar{grid-column:2}.mine .msg-body{grid-column:1;grid-row:1;text-align:right}.mine .bubble{background:#f8d6aa;border-color:#f5c88b;border-radius:15px 4px 15px 15px;text-align:left}.typing{margin:0 24px;color:var(--muted);font-size:12px;min-height:22px}.typing b{color:var(--violet)}.composer{padding:12px 18px 17px;display:flex;gap:9px;background:linear-gradient(transparent,#fffaf1 35%)}.composer input{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 15px;outline:none}.composer input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #fce1bf}.send{background:var(--coral);color:#fff;width:46px;border-radius:14px;font-size:19px;box-shadow:0 5px 12px #df70594a}
    .right{padding:18px;display:flex;flex-direction:column;gap:16px}.right h2{font-size:13px;margin:0;letter-spacing:.05em}.voice-card{background:linear-gradient(145deg,#655783,#4c426c);padding:18px;border-radius:18px;color:white;position:relative;overflow:hidden}.voice-card:after{content:'☁';position:absolute;right:-6px;bottom:-35px;font-size:120px;opacity:.1}.voice-card p{font-size:12px;opacity:.77;margin:3px 0 13px}.voice-live{font:11px 'DM Mono';color:#f7d895;letter-spacing:.1em}.voice-users{display:flex;margin:10px 0 15px}.voice-users .avatar{border:2px solid #665783;margin-right:-7px;width:32px;height:32px;font-size:10px}.join{background:#f6bd57;color:#3f3455;font-weight:700;width:100%;border-radius:11px;padding:10px}.voice-card.in .join{background:#ef9580;color:#fff}.online-list{display:grid;gap:4px}.person{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px}.person:hover{background:var(--cream)}.status{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px #d9f0e5}.person .avatar{width:30px;height:30px;font-size:11px}.person strong{font-size:12px;display:block}.person small{font-size:11px;color:var(--muted)}.mic{margin-left:auto;color:var(--violet);font-size:13px}.history-note{margin-top:auto;background:#f4efe9;border-radius:14px;padding:12px;font-size:11px;color:var(--muted)}.history-note span{font-size:16px;vertical-align:middle;margin-right:4px}
    @media(max-width:900px){.app{grid-template-columns:210px 1fr;padding:14px}.right{display:none}.chat{min-height:calc(100vh - 28px)}}@media(max-width:620px){.app{display:block;padding:8px}.side{display:none}.chat{min-height:calc(100vh - 16px);border-radius:17px}.messages{padding:16px;max-height:calc(100vh - 186px)}.msg{max-width:95%}.chat-top{padding:13px}.top-actions button:first-child{display:none}}
  </style>
</head>
<body>
<main class="app">
  <aside class="panel side"><div class="brand"><div class="cat">🐈</div><div><b>cloud cat</b><small>anonymous rooms</small></div></div><div class="identity"><div class="avatar">あ</div><div><strong id="myName">あまい雲</strong><span>匿名で参加中</span></div></div><section><div class="rooms-head">ROOMS <button class="plus" aria-label="ルームを作成" onclick="createRoom()">＋</button></div><div class="room-list" id="rooms"><button class="room active" onclick="selectRoom(this,'ねこだまり','🐾')"><i>🐾</i>ねこだまり <span class="count">18</span></button><button class="room" onclick="selectRoom(this,'深夜のまど','🌙')"><i>🌙</i>深夜のまど <span class="count">6</span></button><button class="room" onclick="selectRoom(this,'お茶と音楽','☕')"><i>☕</i>お茶と音楽 <span class="count">11</span></button><button class="room" onclick="selectRoom(this,'作業する猫','💻')"><i>💻</i>作業する猫 <span class="count">24</span></button></div></section><div class="side-foot">合言葉はありません。気になる部屋に、ふらりとどうぞ。<br><button onclick="renameMe()">表示名を変える</button></div></aside>
  <section class="panel chat"><header class="chat-top"><div class="room-icon" id="roomIcon">🐾</div><div><div class="room-title" id="roomTitle">ねこだまり</div><div class="room-meta">だれでも参加できます · <span id="memberCount">18</span>人がいる</div></div><div class="top-actions"><button class="circle-btn" title="最近の10件を表示" onclick="showRecent()">↙</button><button class="circle-btn" title="ルーム情報">ⓘ</button></div></header><div class="messages" id="messages"><div class="notice">最近のメッセージ（10件）</div></div><div class="typing" id="typing"></div><form class="composer" onsubmit="sendMessage(event)"><input id="messageInput" autocomplete="off" placeholder="匿名でメッセージを送る…" aria-label="メッセージ" /><button class="send" aria-label="送信">➤</button></form></section>
  <aside class="panel right"><div><h2>VOICE CHAT</h2><div class="voice-card" id="voiceCard"><div class="voice-live">● LIVE · 3人が話しています</div><h3 style="margin:7px 0 0">おひるねラウンジ</h3><p>参加しなくても、ここにいる人が見えます。</p><div class="voice-users"><div class="avatar" style="background:#e5907e">月</div><div class="avatar" style="background:#80acbd">青</div><div class="avatar" style="background:#b598d2">綿</div></div><button class="join" id="joinBtn" onclick="toggleVoice()">🎙 ボイスに参加</button></div></div><div><h2>このルームにいる猫</h2><div class="online-list"><div class="person"><span class="status"></span><div class="avatar" style="background:#e5907e">月</div><div><strong>月見だんご</strong><small>ボイスチャット中</small></div><span class="mic">♬</span></div><div class="person"><span class="status"></span><div class="avatar" style="background:#80acbd">青</div><div><strong>青いソファ</strong><small>ボイスチャット中</small></div><span class="mic">♬</span></div><div class="person"><span class="status"></span><div class="avatar" style="background:#b598d2">綿</div><div><strong>わたあめ</strong><small>ボイスチャット中</small></div><span class="mic">♬</span></div><div class="person"><span class="status"></span><div class="avatar" style="background:#e1aa60">と</div><div><strong>とらねこ</strong><small>テキストチャット中</small></div></div></div><div class="history-note"><span>☁</span>会話の履歴は端末に保存されます。退出しても消えません。</div></aside>
</main>
<script>
const seed=[['月見だんご','月','e5907e','みんな、今日もおつかれさま。'],['青いソファ','青','80acbd','窓をあけたら、ちょうどいい風だったよ。'],['わたあめ','綿','b598d2','それ、いいなあ。こっちは雨のにおい。'],['とらねこ','と','e1aa60','今夜はゆっくり話したい気分です。'],['月見だんご','月','e5907e','ボイスにもいるよ。聞くだけでも歓迎！']];
let activeRoom='ねこだまり';let messages=JSON.parse(localStorage.getItem('cloudcat-messages')||'null')||seed;let typingTimer;
function render(){const root=document.getElementById('messages');root.innerHTML='<div class="notice">最近のメッセージ（10件）</div>';messages.slice(-10).forEach((m,i)=>{let mine=m[0]===document.getElementById('myName').textContent;root.insertAdjacentHTML('beforeend',`<article class="msg ${mine?'mine':''}"><div class="avatar" style="background:#${m[2]}">${m[1]}</div><div class="msg-body"><div class="msg-header">${m[0]}<time>${i+1<10?'今日':'たった今'}</time></div><div class="bubble">${escapeHtml(m[3])}</div></div></article>`)});root.scrollTop=root.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function sendMessage(e){e.preventDefault();const input=document.getElementById('messageInput');if(!input.value.trim())return;const n=document.getElementById('myName').textContent;messages.push([n,n[0],'bb9be1',input.value.trim()]);localStorage.setItem('cloudcat-messages',JSON.stringify(messages));input.value='';render();setTimeout(()=>{document.getElementById('typing').innerHTML='<b>とらねこ</b> が入力中…';setTimeout(()=>document.getElementById('typing').textContent='',1800)},450)}
function toggleVoice(){let card=document.getElementById('voiceCard'),btn=document.getElementById('joinBtn'),on=card.classList.toggle('in');btn.textContent=on?'↪ ボイスから退出':'🎙 ボイスに参加';document.querySelector('.voice-live').textContent=on?'● CONNECTED · 4人が話しています':'● LIVE · 3人が話しています'}
function selectRoom(el,name,icon){document.querySelectorAll('.room').forEach(x=>x.classList.remove('active'));el.classList.add('active');activeRoom=name;document.getElementById('roomTitle').textContent=name;document.getElementById('roomIcon').textContent=icon;document.getElementById('typing').textContent='';render()}
function createRoom(){let name=prompt('新しいルームの名前');if(name){let btn=document.createElement('button');btn.className='room';btn.innerHTML='<i>☁</i>'+escapeHtml(name)+' <span class="count">1</span>';btn.onclick=()=>selectRoom(btn,name,'☁');document.getElementById('rooms').append(btn);btn.click()}}
function renameMe(){let n=prompt('新しい匿名表示名',document.getElementById('myName').textContent);if(n){document.getElementById('myName').textContent=n;localStorage.setItem('cloudcat-name',n)}}
function showRecent(){document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}
document.getElementById('myName').textContent=localStorage.getItem('cloudcat-name')||'あまい雲';document.getElementById('messageInput').addEventListener('input',()=>{clearTimeout(typingTimer);typingTimer=setTimeout(()=>{document.getElementById('typing').innerHTML='<b>とらねこ</b> が入力中…'},600)});render();
</script></body></html>
