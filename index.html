lor:var(--violet)}.composer{padding:12px 18px 17px;display:flex;gap:9px;background:linear-gradient(transparent,#fffaf1 35%)}.composer input{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 15px;outline:none}.composer input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #fce1bf}.upload-label{display:grid;place-items:center;width:45px;border:1px solid var(--line);border-radius:14px;background:var(--cream);color:var(--violet);cursor:pointer}.upload-label .lucide{width:18px;height:18px}.upload-label input{display:none}.send{background:var(--coral);color:#fff;width:46px;border-radius:14px;font-size:19px;box-shadow:0 5px 12px #df70594a}

<body>
<main class="app">
  <aside class="panel side"><div class="brand"><div class="cat" data-icon="cat"></div><div><b>cloud cat</b><small>anonymous rooms</small></div></div><div class="identity"><div class="avatar" id="myAvatar"></div><div><strong id="myName">あまい雲</strong><span>匿名で参加中</span></div></div><section><div class="rooms-head">ROOMS <button class="plus" aria-label="ルームを作成" onclick="createRoom()">＋</button></div><div class="room-list" id="rooms"><button class="room active" onclick="selectRoom(this,'ねこだまり','paw')"><i data-icon="paw"></i>ねこだまり</button><button class="room" onclick="selectRoom(this,'深夜のまど','moon')"><i data-icon="moon"></i>深夜のまど</button><button class="room" onclick="selectRoom(this,'お茶と音楽','star')"><i data-icon="star"></i>お茶と音楽</button><button class="room" onclick="selectRoom(this,'作業する猫','pencil')"><i data-icon="pencil"></i>作業する猫</button></div></section><div class="side-foot">合言葉はありません。気になる部屋に、ふらりとどうぞ。<br><button onclick="renameMe()">表示名を変える</button> · <button onclick="chooseIcon()">アイコンを変える</button></div></aside>
  <section class="panel chat"><header class="chat-top"><div class="room-icon" id="roomIcon" data-icon="paw"></div><div><div class="room-title" id="roomTitle">ねこだまり</div><div class="room-meta">だれでも参加できます · まだ誰もいません</div></div><div class="top-actions"><button class="circle-btn icon-btn" title="最近の10件を表示" onclick="showRecent()" data-icon="alert"></button><button class="circle-btn icon-btn" title="ルーム情報" data-icon="star"></button></div></header><div class="messages" id="messages"><div class="notice">最近のメッセージ（10件）</div></div><div class="typing" id="typing"></div><form class="composer" onsubmit="sendMessage(event)"><label class="upload-label" title="画像を投稿"><span data-icon="pencil"></span><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" onchange="sendImage(event)" /></label><input id="messageInput" autocomplete="off" placeholder="匿名でメッセージを送る…" aria-label="メッセージ" /><button class="send icon-btn" aria-label="送信" data-icon="send"></button></form></section>
  <aside class="panel right"><div><h2>VOICE CHAT</h2><div class="voice-card" id="voiceCard"><div class="voice-live">まだ参加者はいません</div><h3 style="margin:7px 0 0">おひるねラウンジ</h3><p>参加しなくても、入室した人はここに表示されます。</p><button class="join" id="joinBtn" onclick="toggleVoice()"></button></div></div><div><h2>このルームにいる猫</h2><div class="online-list" id="participants"><div class="empty-state"><span data-icon="cat"></span>まだ参加者はいません</div></div></div><div class="history-note"><span></span>会話の履歴は端末に保存されます。退出しても消えません。</div></aside>
  <dialog class="name-dialog" id="nameDialog"><form method="dialog" class="dialog-body" onsubmit="saveName(event)"><h2>表示名を変える</h2><p>この端末で表示する匿名名です。</p><input id="nameInput" maxlength="24" required aria-label="表示名" /><div class="dialog-actions"><button value="cancel">キャンセル</button><button class="save-name" value="save">保存</button></div></form></dialog><dialog class="name-dialog" id="iconDialog"><form method="dialog" class="dialog-body"><h2>アイコンを選ぶ</h2><p>あなたの表示アイコンを選択します。</p><div class="dialog-actions" style="justify-content:flex-start;flex-wrap:wrap" id="iconChoices"></div><div class="dialog-actions"><button value="cancel">閉じる</button></div></form></dialog>
</main>
<script src="/socket.io/socket.io.js"></script><script>
const iconPaths={cat:'M12 5 9 2 5 6v7a7 7 0 0 0 14 0V6l-4-4-3 3M9 13h.01M15 13h.01M9 17c1.5 1 4.5 1 6 0',paw:'M11.6 16.6c1.2-1.4 2.4-2.9 3.2-4.5.7-1.4.7-2.8-.3-3.6-1.1-.9-2.4-.1-3 1.1-.6-1.2-1.9-2-3-1.1-1 .8-1 2.2-.3 3.6.8 1.6 2 3.1 3.2 4.5ZM7 7.5A1.5 1.5 0 1 0 7 4.5a1.5 1.5 0 0 0 0 3Zm10 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z',fish:'M12 8c-3 0-5.5 1.7-7 4 1.5 2.3 4 4 7 4 3.8 0 6.6-2.6 8-4-1.4-1.4-4.2-4-8-4Zm2 4h.01M4 8l-2-2m2 10-2 2',heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.6a5.5 5.5 0 0 0-.1-7.8Z',star:'m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.3-6.2 3.3 1.2-6.8-5-4.9 6.9-1L12 2Z',moon:'M20.6 12.7A8.5 8.5 0 1 1 11.3 3a6.7 6.7 0 0 0 9.3 9.7Z',sparkle:'m12 3-1.5 5.5L5 10l5.5 1.5L12 17l1.5-5.5L19 10l-5.5-1.5L12 3Zm7 12-.7 2.3L16 18l2.3.7L19 21l.7-2.3L22 18l-2.3-.7L19 15Z',sun:'M12 4V2m0 20v-2m5.7-13.7 1.4-1.4m-14.2 14.2 1.4-1.4M20 12h2M2 12h2m13.7 5.7 1.4 1.4M4.9 4.9l1.4 1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z',pencil:'m14 4 6 6M4 20l4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z',send:'m22 2-7 20-4-9-9-4 20-7ZM11 13l4-4',alert:'M12 9v4m0 4h.01M10.3 3.9 2.5 17.4A2 2 0 0 0 4.2 20h15.6a2 2 0 0 0 1.7-2.6L13.7 3.9a2 2 0 0 0-3.4 0Z',mic:'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Zm6 9a6 6 0 0 1-12 0m6 6v4m-4 0h8'};
function icon(name){return `<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="${iconPaths[name]||iconPaths.star}"/></svg>`}function paintIcons(){document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon))}
const sampleMessages=new Set(['みんな、今日もおつかれさま。','窓をあけたら、ちょうどいい風だったよ。','それ、いいなあ。こっちは雨のにおい。','今夜はゆっくり話したい気分です。','ボイスにもいるよ。聞くだけでも歓迎！']);
let activeRoom='ねこだまり',profileIcon=localStorage.getItem('cloudcat-icon')||'cat',messages=(JSON.parse(localStorage.getItem('cloudcat-messages')||'[]')||[]).filter(m=>!sampleMessages.has(m[3])),roomSocket,voiceSocket,localStream,peers=new Map();localStorage.setItem('cloudcat-messages',JSON.stringify(messages));
function youtubeId(value){try{const url=new URL(value.trim());if(url.hostname==='youtu.be')return url.pathname.slice(1).match(/^[\w-]{11}$/)?.[0]||null;if(['youtube.com','www.youtube.com','m.youtube.com'].includes(url.hostname))return (url.searchParams.get('v')||url.pathname.match(/^\/(?:embed|shorts)\/([\w-]{11})/)?.[1]||'').match(/^[\w-]{11}$/)?.[0]||null}catch{return null}}
function messageContent(value){if(value&&typeof value==='object'&&value.image)return `<div class="bubble image-bubble"><img src="${value.image}" alt="投稿された画像" /></div>`;const text=typeof value==='string'?value:value?.text||'',id=youtubeId(text);return id?`<div class="bubble video-bubble"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="YouTube video player" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`:`<div class="bubble">${escapeHtml(text)}</div>`}
function render(){const root=document.getElementById('messages');root.innerHTML='<div class="notice">最近のメッセージ（10件）</div>';messages.slice(-10).forEach((m,i)=>{let mine=m[0]===document.getElementById('myName').textContent;root.insertAdjacentHTML('beforeend',`<article class="msg ${mine?'mine':''}"><div class="avatar" style="background:#${m[2]}">${mine?icon(profileIcon):escapeHtml(m[1])}</div><div class="msg-body"><div class="msg-header">${escapeHtml(m[0])}<time>${i+1<10?'今日':'たった今'}</time></div>${messageContent(m[3])}</div></article>`)});root.scrollTop=root.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function persistMessages(){try{localStorage.setItem('cloudcat-messages',JSON.stringify(messages))}catch{alert('画像が大きすぎて保存できません。500KB以下の画像を選んでください。');messages.pop()}}
function sendMessage(e){e.preventDefault();const input=document.getElementById('messageInput');if(!input.value.trim())return;const n=document.getElementById('myName').textContent;messages.push([n,n[0],'bb9be1',input.value.trim()]);persistMessages();input.value='';render()}
function sendImage(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;if(file.size>500*1024){alert('画像は500KB以下にしてください。');return}const reader=new FileReader();reader.onload=()=>{const n=document.getElementById('myName').textContent;messages.push([n,n[0],'bb9be1',{image:reader.result}]);persistMessages();render()};reader.readAsDataURL(file)}
function setVoiceStatus(text){document.querySelector('.voice-live').textContent=text}function closeVoice(){peers.forEach(peer=>peer.close());peers.clear();localStream?.getTracks().forEach(t=>t.stop());localStream=null;voiceSocket?.emit('voice:leave',{room:activeRoom});document.getElementById('voiceCard').classList.remove('in');document.getElementById('joinBtn').innerHTML=icon('mic')+' ボイスに参加';setVoiceStatus('まだ参加者はいません')}
function peerFor(id){if(peers.has(id))return peers.get(id);const peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(track=>peer.addTrack(track,localStream));peer.onicecandidate=e=>e.candidate&&voiceSocket.emit('voice:signal',{to:id,data:{candidate:e.candidate}});peer.ontrack=e=>{const audio=document.createElement('audio');audio.autoplay=true;audio.srcObject=e.streams[0];document.body.append(audio)};peers.set(id,peer);return peer}
async function connectPeer(id,offer){const peer=peerFor(id);if(offer){await peer.setRemoteDescription(offer);const answer=await peer.createAnswer();await peer.setLocalDescription(answer);voiceSocket.emit('voice:signal',{to:id,data:{answer}})}else{const offer=await peer.createOffer();await peer.setLocalDescription(offer);voiceSocket.emit('voice:signal',{to:id,data:{offer}})}}
async function toggleVoice(){if(localStream){closeVoice();return}try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});voiceSocket=io();voiceSocket.on('voice:peers',ids=>ids.forEach(id=>connectPeer(id)));voiceSocket.on('voice:peer-joined',id=>connectPeer(id));voiceSocket.on('voice:signal',async({from,data})=>{const peer=peerFor(from);if(data.offer)await connectPeer(from,data.offer);if(data.answer)await peer.setRemoteDescription(data.answer);if(data.candidate)await peer.addIceCandidate(data.candidate)});voiceSocket.on('voice:peer-left',id=>{peers.get(id)?.close();peers.delete(id)});voiceSocket.emit('voice:join',{room:activeRoom});document.getElementById('voiceCard').classList.add('in');document.getElementById('joinBtn').innerHTML=icon('mic')+' ボイスから退出';setVoiceStatus('ボイスに参加中')}catch{alert('マイクを使えませんでした。ブラウザのマイク許可を確認してください。')}}
function renderParticipants(users){const root=document.getElementById('participants');if(!users.length){root.innerHTML='<div class="empty-state">'+icon('cat')+'まだ参加者はいません</div>';return}root.innerHTML=users.map(user=>`<div class="person"><span class="status"></span><div class="avatar">${icon(user.icon||'cat')}</div><div><strong>${escapeHtml(user.name)}</strong><small>このルームに参加中</small></div></div>`).join('')}
function joinActiveRoom(){if(!roomSocket)return;roomSocket.emit('room:join',{room:activeRoom,name:document.getElementById('myName').textContent,icon:profileIcon})}
function selectRoom(el,name,iconName){document.querySelectorAll('.room').forEach(x=>x.classList.remove('active'));el.classList.add('active');roomSocket?.emit('room:leave',{room:activeRoom});activeRoom=name;document.getElementById('roomTitle').textContent=name;document.getElementById('roomIcon').innerHTML=icon(iconName);document.getElementById('typing').textContent='';joinActiveRoom();render()}
function createRoom(){let name=prompt('新しいルームの名前');if(name){let btn=document.createElement('button');btn.className='room';btn.innerHTML='<i>'+icon('sparkle')+'</i>'+escapeHtml(name)+' <span class="count">1</span>';btn.onclick=()=>selectRoom(btn,name,'sparkle');document.getElementById('rooms').append(btn);btn.click()}}
function renameMe(){const dialog=document.getElementById('nameDialog');document.getElementById('nameInput').value=document.getElementById('myName').textContent;dialog.showModal();document.getElementById('nameInput').focus()}
function saveName(e){const input=document.getElementById('nameInput'),name=input.value.trim();if(!name){e.preventDefault();return}document.getElementById('myName').textContent=name;localStorage.setItem('cloudcat-name',name);joinActiveRoom();render()}
function chooseIcon(){document.getElementById('iconDialog').showModal()}function setIcon(name){profileIcon=name;localStorage.setItem('cloudcat-icon',name);document.getElementById('myAvatar').innerHTML=icon(name);document.getElementById('iconDialog').close();joinActiveRoom();render()}
function showRecent(){document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight}
const storedName=localStorage.getItem('cloudcat-name')||'あまい雲';document.getElementById('myName').textContent=storedName;paintIcons();document.getElementById('myAvatar').innerHTML=icon(profileIcon);document.getElementById('iconChoices').innerHTML=['cat','paw','fish','heart','star','moon','sparkle','sun','pencil'].map(name=>`<button type="button" aria-label="${name}" onclick="setIcon('${name}')">${icon(name)}</button>`).join('');document.getElementById('joinBtn').innerHTML=icon('mic')+' ボイスに参加';document.querySelector('.history-note span').replaceWith(Object.assign(document.createElement('span'),{innerHTML:icon('heart')}));if(typeof io==='function'){roomSocket=io();roomSocket.on('room:participants',renderParticipants);roomSocket.on('connect',joinActiveRoom)}render();
</script></body></html>
